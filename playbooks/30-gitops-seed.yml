---
# Create the root Argo CD Application that points to the gitops repo, after the
# workload namespaces and the Argo CD health checks. Needs sota_api_base and sota_model.
# Before the seed: report the model pre-pull (no wait). After: check that every gateway pod
# loaded the Kuadrant wasm module (recreate the pods that did not), check that the model uses
# the pre-pulled images, and add the console menu links to the router traces.
- name: GitOps seed
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Report the model pre-pull
      ansible.builtin.include_role:
        name: model_prepull
        tasks_from: status
        apply:
          tags: [model_prepull]
      when: model_prepull_enabled | bool
      tags: always

    - name: Seed the gitops repo
      ansible.builtin.include_role:
        name: argocd_seed
        apply:
          tags: [argocd_seed]
      tags: always

    - name: Check that every gateway pod loaded the Kuadrant wasm module
      ansible.builtin.include_role:
        name: ingress_gateway
        tasks_from: verify
        apply:
          tags: [ingress_gateway]
      # Only after a seed that waited for the workloads: the wasm filter comes with them.
      when:
        - argocd_seed_wait | default(true) | bool
        - not ansible_check_mode
      tags: always

    - name: Add the trace links to the console menu
      ansible.builtin.include_role:
        name: console_links
        apply:
          tags: [console_links]
      when: observability_enabled | bool
      tags: always

    - name: Check that the model uses the pre-pulled images
      ansible.builtin.include_role:
        name: model_prepull
        tasks_from: verify
        apply:
          tags: [model_prepull]
      when: model_prepull_enabled | bool
      tags: always
