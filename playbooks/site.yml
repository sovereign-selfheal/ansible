- name: Preflight
  ansible.builtin.import_playbook: 00-preflight.yml

- name: Early nodes and model pre-pull
  ansible.builtin.import_playbook: 05-early-nodes.yml

- name: Operators
  ansible.builtin.import_playbook: 10-operators.yml

- name: Cluster prerequisites
  ansible.builtin.import_playbook: 20-prereqs.yml

- name: GitOps seed
  ansible.builtin.import_playbook: 30-gitops-seed.yml
