---
# Cluster prerequisites that GitOps cannot handle. For now: GPU MachineSets, when gpu_enabled
# and gpu_nodes_managed. Runs after 10-operators: the GPU wait needs the NVIDIA operator.
# Scale every GPU MachineSet to 0:  -e gpu_enabled=true -e gpu_node_prep_replicas=0
- name: Cluster prerequisites
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Create the GPU MachineSets
      ansible.builtin.include_role:
        name: gpu_node_prep
        apply:
          tags: [gpu_node_prep]
      when:
        - gpu_enabled | bool
        - gpu_nodes_managed | bool
      tags: always
