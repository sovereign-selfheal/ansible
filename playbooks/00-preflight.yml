---
# Read-only checks: cluster reachable, OpenShift 4.22, default StorageClass,
# catalogs READY, operator pins resolved, GPU nodes when gpu_enabled, team users (vault)
# and Keycloak mode when team_users is set. Fails before any change is made.
- name: Preflight
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Run the preflight checks
      ansible.builtin.include_role:
        name: ocp_preflight
        apply:
          tags: [ocp_preflight, preflight]
      tags: always

    - name: Check the team users and detect Keycloak
      ansible.builtin.include_role:
        name: team_access
        tasks_from: preflight
        apply:
          tags: [ocp_preflight, preflight, team_access]
      when: team_access_enabled | bool
      tags: always
