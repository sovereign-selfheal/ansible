---
# =============================================================================
# Non-secret defaults for the bootstrap. Everything here can be overridden with
# -e (AgnosticV passes these as extra vars). Secrets go to vault.yml only.
# =============================================================================

# ----- Target platform --------------------------------------------------------
# Operator pins below are validated only on this OpenShift minor; preflight fails otherwise.
ocp_min_version: "4.22"

# ----- GPU --------------------------------------------------------------------
# Enables NFD + NVIDIA GPU operator (and their CRs) and the GPU nodes, and serves Qwen3.8 27B on GPU.
# false: CPU profile (a small model on CPU, no GPU node), for quick tests only.
gpu_enabled: true
# true: this repo creates the GPU nodes (roles/gpu_node_prep, playbooks/20-prereqs.yml),
#       after the operators. The ClusterPolicy is Ready also with zero GPU nodes.
# false: the GPU nodes come from outside (e.g. an RHDP catalog item with GPUs);
#       preflight then fails if there are none.
gpu_nodes_managed: true
# Pull the local model images on the model nodes early and in parallel, while the operators are
# installed (roles/model_prepull, playbooks/05-early-nodes.yml). Images: model_prepull_images.
model_prepull_enabled: true

# ----- SOTA model and secrets (roles/secrets_bootstrap, roles/argocd_seed) ----------
# Set these in group_vars/all/vault.yml (ansible-vault, see vault.yml.example) or pass
# them as extra vars (AgnosticV). The defaults below are empty on purpose.
sota_api_base: ""        # e.g. https://<provider>/v1
sota_model: ""           # LiteLLM model string, e.g. openai/<model-id>
sota_served_match: ""    # part of the served model id, used by the cost gate
sota_api_key: ""         # secret: lands in the cluster through the External Secrets Operator
# false: the SOTA model answers without reasoning (default: with reasoning it often spent the
# whole token budget and returned an empty answer); true: the model decides.
sota_reasoning: false
# C2 classifier (LLM) of the privacy gate: local (the local model, default), external
# (the classifier_* settings below, from the vault) or off.
classifier_mode: local
classifier_base_url: ""
classifier_model: ""
classifier_api_key: ""   # secret
# The ClusterSecretStore exists when there is a SOTA key to land.
secret_store_enabled: "{{ sota_api_key | length > 0 }}"

# ----- Observability (traces and metrics of the router) -----------------------------
# true: install the OpenTelemetry, Tempo and Cluster Observability operators and the
# distributed tracing console plugin; the seed passes observability.enabled to the gitops repo,
# which then deploys the Tempo instance and the collector. false: no traces, nothing installed.
observability_enabled: true
# Contract with the gitops repo (component observability): namespace, Tempo tenant and the
# ServiceAccount of the collector `otel` (the operator names it otel-collector).
observability_namespace: observability
observability_tempo_tenant: router
observability_collector_service_account: otel-collector
# User workload monitoring (roles/user_workload_monitoring): Prometheus scrapes the
# ServiceMonitors of the demo namespaces (router metrics, vLLM metrics).
user_workload_monitoring_enabled: true
# Alertmanager -> KEDA interceptor -> ogx-alert-translator (gitops AlertmanagerConfig).
user_workload_monitoring_alertmanager_bridge_enabled: "{{ user_workload_monitoring_enabled | bool and keda_http_addon_enabled | bool }}"

# ----- KEDA (Custom Metrics Autoscaler, roles/olm_operator) ---------------------------
# Prerequisite for gitops workloads that use ScaledObject / HTTPScaledObject. The HTTP add-on
# (HTTPScaledObject) is enabled on the cluster KedaController, not a separate OLM operator.
keda_enabled: true
keda_namespace: openshift-keda
keda_http_addon_enabled: true

# ----- Team access (roles/team_access, playbooks/15-identity.yml) ---------------------
# Personal logins for the team: Keycloak users (realm `sso` on RHDP), members of the OpenShift
# Group below, which is cluster-admin and Argo CD admin. The users are set in the vault only
# (see vault.yml.example): a list of {username, password}. The password is the initial one and
# must be changed at the first login.
# Keycloak on RHDP is reused; on other clusters the role installs it (rhbk operator below).
# An empty list turns the feature off (nothing is installed or changed).
team_users: []
team_group: selfheal-team
team_access_enabled: "{{ team_users | length > 0 }}"
keycloak_namespace: keycloak

# ----- Post-install CR settings (rendered by roles/olm_operator/templates) ----
gateway_class_name: openshift-default
gateway_class_controller: openshift.io/gateway-controller/v1   # OCP 4.20+ controller name

kuadrant_namespace: kuadrant-system
authorino_tls_enabled: true
# The gateway denies every request when Authorino does not answer (failureMode deny), so run 2
# replicas. The Authorino CR has no affinity field: spreading on nodes is the scheduler default.
# Limitador stays at 1 replica: its counters are in memory, and more replicas would split them.
authorino_replicas: 2
# PodMonitor (Limitador) and ServiceMonitor (Authorino) for user workload monitoring. The
# Kuadrant CR keeps spec.observability off: on RHCL 1.4.3 it creates a broken Istio PodMonitor
# (TargetDown alerts, see templates/kuadrant-monitors.yaml.j2 of roles/olm_operator).
kuadrant_metrics_enabled: true

rhoai_dsc_name: default-dsc
# DataScienceCluster v2 component states (RHOAI 3.5). Only what the demo needs is Managed.
# Model serving itself (InferenceService / ServingRuntime) is deployed by the gitops repo.
rhoai_dsc_components:
  dashboard: {managementState: Managed}
  kserve:
    managementState: Managed
    # Headed: the predictor Service gets a ClusterIP (port 80 -> 8080). The default,
    # Headless, sends clients straight to the pod on port 80, where nothing listens.
    rawDeploymentServiceConfig: Headed
    nim: {managementState: "{{ 'Managed' if gpu_enabled | bool else 'Removed' }}"}
    modelsAsService: {managementState: Removed}
    wva: {managementState: Removed}
  workbenches: {managementState: Managed, workbenchNamespace: rhods-notebooks}
  aigateway: {managementState: Removed}
  aipipelines: {managementState: Removed}
  feastoperator: {managementState: Removed}
  kueue: {managementState: Removed}
  llamastackoperator: {managementState: Removed}
  mcplifecycleoperator: {managementState: Managed}
  mlflowoperator: {managementState: Removed}
  modelregistry: {managementState: Removed, registriesNamespace: rhoai-model-registries}
  ogx: {managementState: Removed}
  ray: {managementState: Removed}
  sparkoperator: {managementState: Removed}
  trainer: {managementState: Removed}
  trainingoperator: {managementState: Removed}
  trustyai: {managementState: Removed}

# GPU MachineSets (roles/gpu_node_prep, playbooks/20-prereqs.yml): one per worker zone,
# only the first `gpu_node_prep_active_zone_count` zones get machines, to keep costs low.
gpu_node_prep_instance_type: g7e.2xlarge   # 1x NVIDIA RTX PRO 6000 Blackwell 96 GB (native FP4)
gpu_node_prep_active_zone_count: 1
gpu_node_prep_replicas: 1
# Decision model (DiffusionGemma 26B-A4B FP8-dynamic, vLLM structured-read mode, preview image
# NOT supported by Red Hat): a second GPU pool (gpu_node_prep_decision_*, one g6e.2xlarge with an
# NVIDIA L40S), its pre-pull, and decisionModel.enabled for the gitops seed. Off by default.
decision_model_enabled: false
# Namespace policy of the router (v0.11.0): a request about a namespace labelled
# sovereign-selfheal.io/data-class=restricted stays on the local model. The seed always creates the
# labels (agentic-triage: public, payments: restricted) and the RBAC; these switches turn the
# router on (gitops namespacePolicy.scan/hint). scan: names found in the request text, on for the
# demo; hint: names that the agents send (off until the triage-agent release that sends them).
namespace_policy_scan: true
namespace_policy_hint: false

nfd_instance_name: nfd-instance
gpu_cluster_policy_name: gpu-cluster-policy
gpu_mig_strategy: single
gpu_driver_enabled: true        # false when the driver is pre-installed on the nodes
gpu_dcgm_exporter_enabled: true

# ----- Operators ----------------------------------------------------------------
# Installed in list order by playbooks/10-operators.yml (roles/olm_operator).
# Pinning policy (AGENTS.md §3): numbered channel where the catalog offers one,
# explicit starting_csv, installPlanApproval Manual. The role approves only an
# InstallPlan containing starting_csv plus, at most, the CSVs in
# expected_dependency_csvs. Pins resolved with scripts/resolve-operator-versions.sh.
operators:
  # 1. GitOps first: the last bootstrap step seeds an Argo CD Application.
  #    RHDP pre-installs it (channel latest, Automatic): the role adopts that Subscription.
  - key: openshift_gitops
    name: openshift-gitops-operator
    namespace: openshift-gitops-operator
    channel: gitops-1.21
    starting_csv: openshift-gitops-operator.v1.21.4   # resolved on OCP 4.22.14 on 2026-09-23
    # RHDP pre-installs GitOps from `latest`: a newer version than the pin is kept (and frozen
    # with Manual approval) instead of failing, because OLM cannot downgrade.
    allow_newer_installed: true
    source: redhat-operators
    source_namespace: openshift-marketplace
    install_plan_approval: Manual
    create_operator_group: true
    operator_group_all_namespaces: true
    enabled: true

  # 2. cert-manager: prerequisite of RHOAI 3.x KServe. Also pre-installed by RHDP (adopted).
  - key: cert_manager
    name: openshift-cert-manager-operator
    namespace: cert-manager-operator
    channel: stable-v1.20
    starting_csv: cert-manager-operator.v1.20.0   # resolved on OCP 4.22.14 on 2026-09-23
    allow_newer_installed: true                   # pre-installed by RHDP, see openshift_gitops
    source: redhat-operators
    source_namespace: openshift-marketplace
    install_plan_approval: Manual
    create_operator_group: true
    operator_group_all_namespaces: false          # OwnNamespace, as in the old repo
    enabled: true

  # 2b. External Secrets Operator: workload secrets come from an external store through
  #     ExternalSecrets in the gitops repo. The store (ClusterSecretStore) is added later.
  - key: external_secrets
    name: openshift-external-secrets-operator
    namespace: external-secrets-operator
    channel: stable-v1.2
    starting_csv: openshift-external-secrets-operator.v1.2.1   # resolved on OCP 4.22.14 on 2026-09-24
    source: redhat-operators
    source_namespace: openshift-marketplace
    install_plan_approval: Manual
    create_operator_group: true
    operator_group_all_namespaces: true           # AllNamespaces is the only supported install mode
    enabled: true
    post_install:
      - template: external-secrets-config.yaml.j2
        vars:
          name: cluster
        wait:
          api_version: operator.openshift.io/v1alpha1
          kind: ExternalSecretsConfig
          name: cluster
          condition: {type: Ready, status: "True"}
      # The CR is Ready before the webhook is: ExternalSecrets cannot be created until it runs.
      - wait:
          api_version: apps/v1
          kind: Deployment
          name: external-secrets-webhook
          namespace: external-secrets
          condition: {type: Available, status: "True"}

  # 2c. Custom Metrics Autoscaler (KEDA). HTTPScaledObject needs spec.httpAddon on KedaController.
  - key: keda
    name: openshift-custom-metrics-autoscaler-operator
    namespace: "{{ keda_namespace }}"
    namespace_cluster_monitoring: true
    channel: stable                               # only channel
    starting_csv: custom-metrics-autoscaler.v2.19.0-4   # resolved on OCP 4.22.15 on 2026-10-04
    source: redhat-operators
    source_namespace: openshift-marketplace
    install_plan_approval: Manual
    create_operator_group: true
    operator_group_all_namespaces: false          # OwnNamespace: KedaController lives here
    enabled: "{{ keda_enabled }}"
    post_install:
      # Optional: the template below creates the KedaController when the operator did not.
      - wait_exists:
          api_version: keda.sh/v1alpha1
          kind: KedaController
          name: keda
          namespace: "{{ keda_namespace }}"
          timeout: 300
          optional: true
      - template: keda-controller.yaml.j2
        vars:
          namespace: "{{ keda_namespace }}"
          http_addon_enabled: "{{ keda_http_addon_enabled }}"
        wait:
          api_version: keda.sh/v1alpha1
          kind: KedaController
          name: keda
          namespace: "{{ keda_namespace }}"
          status_field: phase
          value: Installation Succeeded
          timeout: 600
      # The operator creates a default KedaController and installs KEDA before the patch above.
      # The status has no observedGeneration, so the phase wait can pass before the HTTP add-on
      # exists: wait for its three Deployments too.
      - wait:
          api_version: apps/v1
          kind: Deployment
          name: keda-add-ons-http-operator
          namespace: "{{ keda_namespace }}"
          condition: {type: Available, status: "True"}
          timeout: 300
        enabled: "{{ keda_http_addon_enabled }}"
      - wait:
          api_version: apps/v1
          kind: Deployment
          name: keda-add-ons-http-interceptor
          namespace: "{{ keda_namespace }}"
          condition: {type: Available, status: "True"}
          timeout: 300
        enabled: "{{ keda_http_addon_enabled }}"
      - wait:
          api_version: apps/v1
          kind: Deployment
          name: keda-add-ons-http-scaler
          namespace: "{{ keda_namespace }}"
          condition: {type: Available, status: "True"}
          timeout: 300
        enabled: "{{ keda_http_addon_enabled }}"

  # 2d. Red Hat build of Keycloak: the identity provider of the team users (roles/team_access).
  #     RHDP pre-installs it (namespace keycloak, Automatic): the role adopts that Subscription.
  #     Only when team_access_enabled.
  - key: rhbk
    name: rhbk-operator
    namespace: "{{ keycloak_namespace }}"
    # RHDP uses the same Subscription name (rhbk-operator), namespace and OwnNamespace OperatorGroup
    # (keycloak-og), checked on OCP 4.22.14 on 2026-09-28.
    channel: stable-v26.6
    starting_csv: rhbk-operator.v26.6.7-opr.1     # resolved on OCP 4.22.14 on 2026-09-28
    # Pre-installed by RHDP from its own channel: a newer version than the pin is kept and frozen
    # with Manual approval (approved by the team on 2026-09-28, see AGENTS.md §9).
    allow_newer_installed: true
    source: redhat-operators
    source_namespace: openshift-marketplace
    install_plan_approval: Manual
    create_operator_group: true
    operator_group_all_namespaces: false          # OwnNamespace: the Keycloak CR lives here
    enabled: "{{ team_access_enabled }}"

  # 3. Red Hat Connectivity Link, before RHOAI so odh-model-controller starts with Kuadrant present.
  #    Installed in openshift-operators (existing global-operators OperatorGroup). Only a
  #    `stable` channel exists; the pin + Manual approval freeze the version.
  #    NOTE: Manual approval in openshift-operators also gates upgrades of every other
  #    operator subscribed in that namespace (OLM resolves a namespace as a unit).
  - key: rhcl
    name: rhcl-operator
    namespace: openshift-operators
    manage_namespace: false
    channel: stable
    starting_csv: rhcl-operator.v1.4.3            # resolved on OCP 4.22.14 on 2026-09-23
    # OLM dependencies resolved into the same InstallPlan (all from redhat-operators).
    expected_dependency_csvs:
      - authorino-operator.v1.4.3                 # resolved on OCP 4.22.14 on 2026-09-23
      - limitador-operator.v1.4.2                 # resolved on OCP 4.22.14 on 2026-09-23
      - dns-operator.v1.4.2                       # resolved on OCP 4.22.14 on 2026-09-23
    source: redhat-operators
    source_namespace: openshift-marketplace
    install_plan_approval: Manual
    create_operator_group: false
    enabled: true
    # Gateway API provider BEFORE the Subscription: the Kuadrant operator detects Istio only
    # when it starts (otherwise Kuadrant stays MissingDependency until its pod is restarted).
    pre_install:
      - template: gatewayclass.yaml.j2
        vars:
          name: "{{ gateway_class_name }}"
          controller_name: "{{ gateway_class_controller }}"
        wait:
          api_version: gateway.networking.k8s.io/v1
          kind: GatewayClass
          name: "{{ gateway_class_name }}"
          condition: {type: Accepted, status: "True"}
      # Istio CRDs installed by the Ingress Operator for the GatewayClass (checked by Kuadrant).
      - wait_exists:
          api_version: apiextensions.k8s.io/v1
          kind: CustomResourceDefinition
          name: wasmplugins.extensions.istio.io
    post_install:
      - template: namespace.yaml.j2
        vars:
          name: "{{ kuadrant_namespace }}"
      - template: kuadrant.yaml.j2
        vars:
          namespace: "{{ kuadrant_namespace }}"
        wait:
          api_version: kuadrant.io/v1beta1
          kind: Kuadrant
          name: kuadrant
          namespace: "{{ kuadrant_namespace }}"
          condition: {type: Ready, status: "True"}
          timeout: 600
      # Authorino TLS (RHOAI 3.5 docs): annotate the Service so service-ca mints the cert.
      - template: authorino-service-cert.yaml.j2
        state: patched
        enabled: "{{ authorino_tls_enabled }}"
        vars:
          namespace: "{{ kuadrant_namespace }}"
        wait_exists:
          api_version: v1
          kind: Service
          name: authorino-authorino-authorization
          namespace: "{{ kuadrant_namespace }}"
      - template: authorino.yaml.j2
        enabled: "{{ authorino_tls_enabled }}"
        vars:
          namespace: "{{ kuadrant_namespace }}"
          replicas: "{{ authorino_replicas }}"
        wait:
          api_version: operator.authorino.kuadrant.io/v1beta1
          kind: Authorino
          name: authorino
          namespace: "{{ kuadrant_namespace }}"
          condition: {type: Ready, status: "True"}
      # Metrics of Limitador and Authorino (see the template for why not observability.enable).
      - template: kuadrant-monitors.yaml.j2
        enabled: "{{ kuadrant_metrics_enabled }}"
        vars:
          namespace: "{{ kuadrant_namespace }}"

  # 3b. RHCL dependencies. OLM creates their Subscriptions while it installs rhcl (Automatic,
  #     named <package>-<channel>-<source>-<source namespace>). These entries adopt them:
  #     Manual approval + pinned startingCSV, so they cannot upgrade on their own.
  - key: authorino
    name: authorino-operator
    subscription_name: authorino-operator-stable-redhat-operators-openshift-marketplace
    namespace: openshift-operators
    manage_namespace: false
    channel: stable
    starting_csv: authorino-operator.v1.4.3       # resolved on OCP 4.22.14 on 2026-09-23
    source: redhat-operators
    source_namespace: openshift-marketplace
    install_plan_approval: Manual
    create_operator_group: false
    enabled: true

  - key: limitador
    name: limitador-operator
    subscription_name: limitador-operator-stable-redhat-operators-openshift-marketplace
    namespace: openshift-operators
    manage_namespace: false
    channel: stable
    starting_csv: limitador-operator.v1.4.2       # resolved on OCP 4.22.14 on 2026-09-23
    source: redhat-operators
    source_namespace: openshift-marketplace
    install_plan_approval: Manual
    create_operator_group: false
    enabled: true

  - key: dns_operator
    name: dns-operator
    subscription_name: dns-operator-stable-redhat-operators-openshift-marketplace
    namespace: openshift-operators
    manage_namespace: false
    channel: stable
    starting_csv: dns-operator.v1.4.2             # resolved on OCP 4.22.14 on 2026-09-23
    source: redhat-operators
    source_namespace: openshift-marketplace
    install_plan_approval: Manual
    create_operator_group: false
    enabled: true

  # 4. Red Hat OpenShift AI 3.5 + DataScienceCluster (KServe RawDeployment).
  - key: rhoai
    name: rhods-operator
    namespace: redhat-ods-operator
    channel: stable-3.5
    starting_csv: rhods-operator.3.5.1            # resolved on OCP 4.22.14 on 2026-09-23
    source: redhat-operators
    source_namespace: openshift-marketplace
    install_plan_approval: Manual
    create_operator_group: true
    operator_group_all_namespaces: true
    csv_wait_timeout: 1200
    enabled: true
    post_install:
      - template: rhoai-dsc.yaml.j2
        vars:
          name: "{{ rhoai_dsc_name }}"
          components: "{{ rhoai_dsc_components }}"
        wait:
          api_version: datasciencecluster.opendatahub.io/v2
          kind: DataScienceCluster
          name: "{{ rhoai_dsc_name }}"
          status_field: phase
          value: Ready
          timeout: 1200

  # 5-6. GPU stack, only when gpu_enabled (NFD labels are needed by the ClusterPolicy).
  - key: nfd
    name: nfd
    namespace: openshift-nfd
    namespace_cluster_monitoring: true
    channel: stable                               # only channel; tracks the OCP minor
    starting_csv: nfd.4.22.0-202609151747         # resolved on OCP 4.22.14 on 2026-09-23
    source: redhat-operators
    source_namespace: openshift-marketplace
    install_plan_approval: Manual
    create_operator_group: true
    operator_group_all_namespaces: false
    enabled: "{{ gpu_enabled }}"
    post_install:
      - template: nfd-instance.yaml.j2
        vars:
          name: "{{ nfd_instance_name }}"
          namespace: openshift-nfd
        wait:
          api_version: nfd.openshift.io/v1
          kind: NodeFeatureDiscovery
          name: "{{ nfd_instance_name }}"
          namespace: openshift-nfd
          condition: {type: Available, status: "True"}

  - key: gpu_operator
    name: gpu-operator-certified
    namespace: nvidia-gpu-operator
    namespace_cluster_monitoring: true
    channel: v26.7
    starting_csv: gpu-operator-certified.v26.7.0  # resolved on OCP 4.22.14 on 2026-09-23
    source: certified-operators
    source_namespace: openshift-marketplace
    install_plan_approval: Manual
    create_operator_group: true
    operator_group_all_namespaces: false
    csv_wait_timeout: 1200
    enabled: "{{ gpu_enabled }}"
    post_install:
      - template: gpu-cluster-policy.yaml.j2
        vars:
          name: "{{ gpu_cluster_policy_name }}"
          mig_strategy: "{{ gpu_mig_strategy }}"
          driver_enabled: "{{ gpu_driver_enabled }}"
          dcgm_exporter_enabled: "{{ gpu_dcgm_exporter_enabled }}"
        wait:
          api_version: nvidia.com/v1
          kind: ClusterPolicy
          name: "{{ gpu_cluster_policy_name }}"
          status_field: state
          value: ready
          timeout: 1800

  # 7-9. Observability of the routing decisions (observability_enabled): traces in Tempo through
  #      an OpenTelemetry collector, shown in the console (Observe -> Traces) by the COO UI plugin.
  #      The Tempo instance and the collector are deployed by the gitops repo (namespace
  #      observability, see AGENTS.md §7). Only a `stable` channel exists for the three packages;
  #      the pin + Manual approval freeze the version. Own namespaces, not openshift-operators.
  - key: opentelemetry
    name: opentelemetry-product
    namespace: openshift-opentelemetry-operator
    namespace_cluster_monitoring: true
    channel: stable                               # only channel
    starting_csv: opentelemetry-operator.v0.158.0-2   # resolved on OCP 4.22.14 on 2026-09-26
    source: redhat-operators
    source_namespace: openshift-marketplace
    install_plan_approval: Manual
    create_operator_group: true
    operator_group_all_namespaces: true           # AllNamespaces is the only supported install mode
    enabled: "{{ observability_enabled }}"

  - key: tempo
    name: tempo-product
    namespace: openshift-tempo-operator
    namespace_cluster_monitoring: true
    channel: stable                               # only channel
    starting_csv: tempo-operator.v0.22.0-2        # resolved on OCP 4.22.14 on 2026-09-26
    source: redhat-operators
    source_namespace: openshift-marketplace
    install_plan_approval: Manual
    create_operator_group: true
    operator_group_all_namespaces: true           # AllNamespaces is the only supported install mode
    enabled: "{{ observability_enabled }}"
    post_install:
      # Tempo runs with multi-tenancy (openshift mode, the supported setup): the collector of the
      # gitops repo may write the router tenant. Readers need the matching read permission;
      # cluster-admin has it already.
      - template: tempo-tenant-rbac.yaml.j2
        vars:
          tenant: "{{ observability_tempo_tenant }}"
          namespace: "{{ observability_namespace }}"
          service_account: "{{ observability_collector_service_account }}"

  - key: cluster_observability
    name: cluster-observability-operator
    namespace: openshift-cluster-observability-operator
    namespace_cluster_monitoring: true
    channel: stable                               # `fast` offers the same CSV today
    starting_csv: cluster-observability-operator.v1.5.2   # resolved on OCP 4.22.14 on 2026-09-26
    source: redhat-operators
    source_namespace: openshift-marketplace
    install_plan_approval: Manual
    create_operator_group: true
    operator_group_all_namespaces: true           # AllNamespaces is the only supported install mode
    enabled: "{{ observability_enabled }}"
    post_install:
      # Console plugin Observe -> Traces. It finds the Tempo instance of the gitops repo by itself.
      - template: uiplugin-distributed-tracing.yaml.j2
        vars:
          name: distributed-tracing
        wait:
          api_version: observability.openshift.io/v1alpha1
          kind: UIPlugin
          name: distributed-tracing
          condition: {type: Available, status: "True"}
      # Perses dashboards in the console (Observe -> Dashboards): the gitops repo adds the
      # dashboard of the routing decisions.
      - template: uiplugin-monitoring-perses.yaml.j2
        vars:
          name: monitoring
        wait:
          api_version: observability.openshift.io/v1alpha1
          kind: UIPlugin
          name: monitoring
          condition: {type: Available, status: "True"}
