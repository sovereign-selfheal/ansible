---
# triage-agent-operator (github.com/sovereign-selfheal/triage-agent-operator): reconciles
# TriageAgent CRs (triage.sovereign-selfheal.io/v1alpha1) that gitops deploys via
# components/triage-agent-operator-cr. The CRD in files/crd.yaml is a copy of
# triage-agent-operator/deploy/crd.yaml (refresh with scripts/sync-triage-agent-operator-crd.sh).

triage_agent_operator_enabled: true
triage_agent_operator_namespace: triage-agent-operator
triage_agent_operator_name: triage-agent-operator

# Pin by digest (same convention as roles/model_prepull and gitops image pins).
# tag 9101ef2 on quay.io/sovereign-selfheal/triage-agent-operator, resolved 2026-10-09.
# Fixes the two crash-level bugs amedeos found in ansible#20 (ModuleNotFoundError at
# start, missing DynamicClient.apply) plus the latent status/replicas/LOG_LEVEL/knowledge
# mount issues; see triage-agent-operator v0.3.0 and
# https://github.com/sovereign-selfheal/ansible/pull/20#issuecomment-6077889987
triage_agent_operator_image: quay.io/sovereign-selfheal/triage-agent-operator@sha256:c4181ea70b0211b7f5fd5d55edb688f188ab06cd8bbc40fb066a8df62b301d2f
triage_agent_operator_replicas: 1
triage_agent_operator_log_level: INFO

triage_agent_operator_resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

triage_agent_operator_wait: true
triage_agent_operator_wait_retries: 30
triage_agent_operator_wait_delay: 10
