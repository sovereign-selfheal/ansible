---
# gpu_node_prep: one GPU MachineSet per availability zone, cloned from the worker
# MachineSet of that zone (AWS only). Only the first `gpu_node_prep_active_zone_count`
# zones get `gpu_node_prep_replicas` machines; the others are created with 0 replicas.

gpu_node_prep_instance_type: g6.xlarge          # 1x NVIDIA L4 24 GB
# Zones to cover. Empty: every zone that has a worker MachineSet, sorted by name.
gpu_node_prep_zones: []
gpu_node_prep_active_zone_count: 1
gpu_node_prep_replicas: 1                       # per active zone; 0 scales every GPU MachineSet down

# Root disk of the GPU nodes (EBS). The model images need space: after the first pull of
# Granite and vLLM a 100 GiB disk was 57% full, and the kubelet deletes unused images at 85%.
# Changes apply only to new Machines: scale the MachineSet to 0 and back to 1.
gpu_node_prep_volume_size: 200                  # GiB
gpu_node_prep_volume_type: gp3
# Empty: the gp3 baseline (3000 IOPS, 125 MB/s). The image download (about 22 MB/s from
# quay.io) is slower than the baseline disk, so raise these only if a measurement shows the disk.
gpu_node_prep_volume_iops: ""
gpu_node_prep_volume_throughput: ""             # MB/s, gp3 only

# Labels and taints for the GPU nodes. The taint keeps non-GPU workloads away; the NVIDIA
# daemonsets tolerate it by default, GPU workloads must tolerate it.
gpu_node_prep_node_labels:
  node-role.kubernetes.io/gpu: ""
gpu_node_prep_taints:
  - key: nvidia.com/gpu
    value: "true"
    effect: NoSchedule

# false: only create or scale the MachineSets (playbooks/05-early-nodes.yml); the waits
# below run later in playbooks/20-prereqs.yml.
gpu_node_prep_wait: true
# Wait for machines to be Running (or gone, when scaling down).
gpu_node_prep_timeout: 1500
# Then wait until every GPU node exposes nvidia.com/gpu (NVIDIA driver built and device
# plugin running). Needs the GPU operator, installed by 10-operators before this role.
gpu_node_prep_wait_gpu_allocatable: true
gpu_node_prep_gpu_timeout: 1500
# Finally wait until the NVIDIA ClusterPolicy is `ready` again: after a new node joins, the
# metrics components (dcgm, dcgm-exporter) need about a minute more than the GPU itself.
gpu_node_prep_wait_cluster_policy: true
gpu_node_prep_cluster_policy_name: "{{ gpu_cluster_policy_name | default('gpu-cluster-policy') }}"
gpu_node_prep_poll_delay: 15

gpu_node_prep_machine_api_namespace: openshift-machine-api
