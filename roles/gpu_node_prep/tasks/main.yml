---
# Create (or scale) the GPU MachineSets, then wait for the GPU nodes.
# gpu_node_prep_wait false: create only. playbooks/05-early-nodes.yml uses it so that AWS
# builds the GPU node while the operators are installed; playbooks/20-prereqs.yml waits.

- name: Ensure the GPU MachineSets
  ansible.builtin.include_tasks: machinesets.yml

- name: Wait for the GPU nodes
  ansible.builtin.include_tasks: wait.yml
  when: gpu_node_prep_wait | bool
