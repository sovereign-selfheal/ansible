---
# One GPU MachineSet per zone, cloned from that zone's worker MachineSet: same AMI,
# subnet, security groups and tags; only instance type, labels and taints change.

- name: Reconcile GPU MachineSets
  ansible.builtin.debug:
    msg: >-
      Reconciling GPU MachineSets: instance_type={{ gpu_node_prep_instance_type }}
      zones={{ gpu_node_prep_zones | default([], true) or 'all worker zones' }}
      active_zones={{ gpu_node_prep_active_zone_count }} replicas_per_active_zone={{ gpu_node_prep_replicas }}
      check_mode={{ ansible_check_mode }}

- name: Read the cluster Infrastructure
  kubernetes.core.k8s_info:
    api_version: config.openshift.io/v1
    kind: Infrastructure
    name: cluster
  register: gpu_node_prep_infra

- name: Assert the platform is AWS
  ansible.builtin.assert:
    that:
      - (gpu_node_prep_infra.resources | first).status.platformStatus.type == 'AWS'
    fail_msg: >-
      gpu_node_prep supports only AWS (platform is
      {{ (gpu_node_prep_infra.resources | first).status.platformStatus.type }}).
    quiet: true

- name: List the MachineSets
  kubernetes.core.k8s_info:
    api_version: machine.openshift.io/v1beta1
    kind: MachineSet
    namespace: "{{ gpu_node_prep_machine_api_namespace }}"
  register: gpu_node_prep_machinesets

- name: Pick one worker MachineSet per zone as the source
  vars:
    gpu_node_prep_workers: >-
      {{ gpu_node_prep_machinesets.resources
         | selectattr('spec.template.metadata.labels', 'defined')
         | selectattr('spec.template.metadata.labels', 'contains', 'machine.openshift.io/cluster-api-machine-type')
         | list }}
  ansible.builtin.set_fact:
    gpu_node_prep_infra_id: "{{ (gpu_node_prep_infra.resources | first).status.infrastructureName }}"
    gpu_node_prep_sources: >-
      {%- set acc = namespace(by_zone={}) -%}
      {%- for ms in gpu_node_prep_workers | sort(attribute='metadata.name') -%}
      {%- set labels = ms.spec.template.metadata.labels -%}
      {%- set zone = ms.spec.template.spec.providerSpec.value.placement.availabilityZone -%}
      {%- if labels['machine.openshift.io/cluster-api-machine-role'] | default('') == 'worker'
            and labels['machine.openshift.io/cluster-api-machine-type'] | default('') == 'worker'
            and zone not in acc.by_zone -%}
      {%- set acc.by_zone = acc.by_zone | combine({zone: ms}) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ acc.by_zone }}

- name: Resolve the zones
  ansible.builtin.set_fact:
    gpu_node_prep_zone_list: "{{ gpu_node_prep_zones if gpu_node_prep_zones | length > 0 else (gpu_node_prep_sources.keys() | sort) }}"

- name: Assert every zone has a worker MachineSet to clone
  ansible.builtin.assert:
    that:
      - gpu_node_prep_zone_list | length > 0
      - gpu_node_prep_zone_list | difference(gpu_node_prep_sources.keys() | list) | length == 0
    fail_msg: >-
      No worker MachineSet to clone for zones
      {{ gpu_node_prep_zone_list | difference(gpu_node_prep_sources.keys() | list) }}
      (worker zones: {{ gpu_node_prep_sources.keys() | list }}).
    quiet: true

- name: Ensure the GPU MachineSets
  vars:
    gpu_node_prep_source: "{{ gpu_node_prep_sources[gpu_node_prep_zone] }}"
    gpu_node_prep_name: "{{ gpu_node_prep_infra_id }}-gpu-{{ gpu_node_prep_zone }}"
    gpu_node_prep_zone_replicas: >-
      {{ (gpu_node_prep_replicas | int) if gpu_node_prep_index < (gpu_node_prep_active_zone_count | int) else 0 }}
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: machine.openshift.io/v1beta1
      kind: MachineSet
      metadata:
        name: "{{ gpu_node_prep_name }}"
        namespace: "{{ gpu_node_prep_machine_api_namespace }}"
        labels:
          machine.openshift.io/cluster-api-cluster: "{{ gpu_node_prep_infra_id }}"
      spec:
        replicas: "{{ gpu_node_prep_zone_replicas | int }}"
        selector:
          matchLabels:
            machine.openshift.io/cluster-api-cluster: "{{ gpu_node_prep_infra_id }}"
            machine.openshift.io/cluster-api-machineset: "{{ gpu_node_prep_name }}"
        template:
          metadata:
            labels:
              machine.openshift.io/cluster-api-cluster: "{{ gpu_node_prep_infra_id }}"
              machine.openshift.io/cluster-api-machine-role: worker
              machine.openshift.io/cluster-api-machine-type: gpu
              machine.openshift.io/cluster-api-machineset: "{{ gpu_node_prep_name }}"
          spec:
            metadata:
              labels: "{{ gpu_node_prep_node_labels }}"
            taints: "{{ gpu_node_prep_taints }}"
            providerSpec:
              value: >-
                {{ gpu_node_prep_source.spec.template.spec.providerSpec.value
                   | combine({'instanceType': gpu_node_prep_instance_type}) }}
  loop: "{{ gpu_node_prep_zone_list }}"
  loop_control:
    loop_var: gpu_node_prep_zone
    index_var: gpu_node_prep_index

- name: Wait for the GPU machines
  when: not ansible_check_mode
  vars:
    gpu_node_prep_expected: >-
      {{ [gpu_node_prep_zone_list | length, gpu_node_prep_active_zone_count | int] | min * (gpu_node_prep_replicas | int) }}
  block:
    # Done when the expected number of machines is Running (0 after a scale-down),
    # or as soon as one machine is Failed (e.g. AWS quota or capacity errors).
    - name: Wait until the GPU machines are Running or one fails
      kubernetes.core.k8s_info:
        api_version: machine.openshift.io/v1beta1
        kind: Machine
        namespace: "{{ gpu_node_prep_machine_api_namespace }}"
        label_selectors:
          - "machine.openshift.io/cluster-api-cluster={{ gpu_node_prep_infra_id }}"
          - "machine.openshift.io/cluster-api-machine-type=gpu"
      register: gpu_node_prep_machines
      until: >-
        (gpu_node_prep_machines.resources | selectattr('status.phase', 'defined')
         | selectattr('status.phase', 'equalto', 'Failed') | list | length > 0)
        or (gpu_node_prep_machines.resources | length == gpu_node_prep_expected | int
            and gpu_node_prep_machines.resources | selectattr('status.phase', 'defined')
                | selectattr('status.phase', 'equalto', 'Running') | list | length == gpu_node_prep_expected | int)
      retries: "{{ ((gpu_node_prep_timeout | int) / (gpu_node_prep_poll_delay | int)) | round(0, 'ceil') | int }}"
      delay: "{{ gpu_node_prep_poll_delay }}"
      failed_when: false

    - name: Assert no GPU machine failed
      vars:
        gpu_node_prep_failed: >-
          {{ gpu_node_prep_machines.resources | default([]) | selectattr('status.phase', 'defined')
             | selectattr('status.phase', 'equalto', 'Failed') | list }}
      ansible.builtin.assert:
        that:
          - gpu_node_prep_failed | length == 0
        fail_msg: >-
          GPU machine(s) failed:
          {% for m in gpu_node_prep_failed %}{{ m.metadata.name }}: {{ m.status.errorMessage | default('no message') }}; {% endfor %}
          Check the AWS quota for G instances and the {{ gpu_node_prep_instance_type }} capacity in the zone.
        quiet: true

    - name: Assert the GPU machines are Running
      ansible.builtin.assert:
        that:
          - gpu_node_prep_machines.resources | length == gpu_node_prep_expected | int
          - >-
            gpu_node_prep_machines.resources | selectattr('status.phase', 'defined')
            | selectattr('status.phase', 'equalto', 'Running') | list | length == gpu_node_prep_expected | int
        fail_msg: >-
          Expected {{ gpu_node_prep_expected }} Running GPU machine(s) after {{ gpu_node_prep_timeout }}s, found:
          {% for m in gpu_node_prep_machines.resources %}{{ m.metadata.name }}={{ m.status.phase | default('n/a') }} {% endfor %}
        success_msg: "{{ gpu_node_prep_expected }} GPU machine(s) Running"

    - name: Wait for the GPU nodes to be Ready
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Node
        label_selectors:
          - "{{ gpu_node_prep_node_labels.keys() | first }}"
        wait: true
        wait_condition: {type: Ready, status: "True"}
        wait_timeout: 600
      when: gpu_node_prep_expected | int > 0

    - name: Wait until every GPU node exposes nvidia.com/gpu
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Node
        label_selectors:
          - "{{ gpu_node_prep_node_labels.keys() | first }}"
      register: gpu_node_prep_gpu_nodes
      vars:
        gpu_node_prep_with_gpu: >-
          {%- set acc = namespace(n=0) -%}
          {%- for node in gpu_node_prep_gpu_nodes.resources | default([]) -%}
          {%- if (node.status.allocatable | default({}))['nvidia.com/gpu'] | default('0') | int >= 1 -%}
          {%- set acc.n = acc.n + 1 -%}
          {%- endif -%}
          {%- endfor -%}
          {{ acc.n }}
      until:
        - gpu_node_prep_gpu_nodes.resources | length == gpu_node_prep_expected | int
        - gpu_node_prep_with_gpu | int == gpu_node_prep_expected | int
      retries: "{{ ((gpu_node_prep_gpu_timeout | int) / (gpu_node_prep_poll_delay | int)) | round(0, 'ceil') | int }}"
      delay: "{{ gpu_node_prep_poll_delay }}"
      when:
        - gpu_node_prep_expected | int > 0
        - gpu_node_prep_wait_gpu_allocatable | bool

    - name: Wait until the NVIDIA ClusterPolicy is ready
      kubernetes.core.k8s_info:
        api_version: nvidia.com/v1
        kind: ClusterPolicy
        name: "{{ gpu_node_prep_cluster_policy_name }}"
      register: gpu_node_prep_cluster_policy
      until:
        - gpu_node_prep_cluster_policy.resources | length == 1
        - (gpu_node_prep_cluster_policy.resources | first).status.state | default('') == 'ready'
      retries: "{{ ((gpu_node_prep_gpu_timeout | int) / (gpu_node_prep_poll_delay | int)) | round(0, 'ceil') | int }}"
      delay: "{{ gpu_node_prep_poll_delay }}"
      when:
        - gpu_node_prep_expected | int > 0
        - gpu_node_prep_wait_cluster_policy | bool
