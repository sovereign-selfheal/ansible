---
# The MachineSets of one GPU pool (gpu_node_prep_pool), one per zone, cloned from that zone's
# worker MachineSet (tasks/sources.yml): instance type, root disk, labels and taints change.
# Names: <infra-id>-<pool>-<zone>; the pool `gpu` keeps the names of the single-pool role.

- name: Resolve the zones of the pool
  ansible.builtin.set_fact:
    gpu_node_prep_zone_list: >-
      {{ gpu_node_prep_pool.zones if gpu_node_prep_pool.zones | default([], true) | length > 0
         else (gpu_node_prep_sources.keys() | sort) }}

# tasks/wait.yml reads the zones of each pool from this dict: gpu_node_prep_zone_list is one host
# fact, and after the loop over the pools it holds the zones of the last pool only.
- name: Remember the zones of the pool for the wait
  ansible.builtin.set_fact:
    gpu_node_prep_pool_zones: "{{ gpu_node_prep_pool_zones | default({}) | combine({gpu_node_prep_pool.name: gpu_node_prep_zone_list}) }}"

- name: Assert every zone has a worker MachineSet to clone
  ansible.builtin.assert:
    that:
      - gpu_node_prep_zone_list | length > 0
      - gpu_node_prep_zone_list | difference(gpu_node_prep_sources.keys() | list) | length == 0
    fail_msg: >-
      Pool {{ gpu_node_prep_pool.name }}: no worker MachineSet to clone for zones
      {{ gpu_node_prep_zone_list | difference(gpu_node_prep_sources.keys() | list) }}
      (worker zones: {{ gpu_node_prep_sources.keys() | list }}).
    quiet: true

- name: Ensure the MachineSets of the pool
  vars:
    gpu_node_prep_source: "{{ gpu_node_prep_sources[gpu_node_prep_zone] }}"
    gpu_node_prep_name: "{{ gpu_node_prep_infra_id }}-{{ gpu_node_prep_pool.name }}-{{ gpu_node_prep_zone }}"
    gpu_node_prep_zone_replicas: >-
      {{ (gpu_node_prep_pool.replicas | int) if gpu_node_prep_index < (gpu_node_prep_pool.active_zone_count | int) else 0 }}
    # Root disk: the worker's first block device with the pool's size, type and (when set) IOPS and
    # throughput. Encryption, KMS key and any other block device stay as in the worker.
    gpu_node_prep_source_devices: "{{ gpu_node_prep_source.spec.template.spec.providerSpec.value.blockDevices | default([{'ebs': {}}], true) }}"
    gpu_node_prep_root_ebs: >-
      {{ (gpu_node_prep_source_devices | first).ebs | default({})
         | combine({'volumeSize': gpu_node_prep_pool.volume_size | int, 'volumeType': gpu_node_prep_pool.volume_type})
         | combine({'iops': gpu_node_prep_pool.volume_iops | int} if gpu_node_prep_pool.volume_iops | string | length > 0 else {})
         | combine({'throughput': gpu_node_prep_pool.volume_throughput | int} if gpu_node_prep_pool.volume_throughput | string | length > 0 else {}) }}
    gpu_node_prep_block_devices: >-
      {{ [(gpu_node_prep_source_devices | first) | combine({'ebs': gpu_node_prep_root_ebs})] + (gpu_node_prep_source_devices[1:] | list) }}
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: machine.openshift.io/v1beta1
      kind: MachineSet
      metadata:
        name: "{{ gpu_node_prep_name }}"
        namespace: "{{ gpu_node_prep_machine_api_namespace }}"
        labels:
          machine.openshift.io/cluster-api-cluster: "{{ gpu_node_prep_infra_id }}"
      spec:
        replicas: "{{ gpu_node_prep_zone_replicas | int }}"
        selector:
          matchLabels:
            machine.openshift.io/cluster-api-cluster: "{{ gpu_node_prep_infra_id }}"
            machine.openshift.io/cluster-api-machineset: "{{ gpu_node_prep_name }}"
        template:
          metadata:
            labels:
              machine.openshift.io/cluster-api-cluster: "{{ gpu_node_prep_infra_id }}"
              machine.openshift.io/cluster-api-machine-role: worker
              machine.openshift.io/cluster-api-machine-type: "{{ gpu_node_prep_pool.name }}"
              machine.openshift.io/cluster-api-machineset: "{{ gpu_node_prep_name }}"
          spec:
            metadata:
              labels: "{{ gpu_node_prep_pool.node_labels }}"
            taints: "{{ gpu_node_prep_pool.taints }}"
            providerSpec:
              value: >-
                {{ gpu_node_prep_source.spec.template.spec.providerSpec.value
                   | combine({'instanceType': gpu_node_prep_pool.instance_type,
                              'blockDevices': gpu_node_prep_block_devices}) }}
  loop: "{{ gpu_node_prep_zone_list }}"
  loop_control:
    loop_var: gpu_node_prep_zone
    index_var: gpu_node_prep_index
    label: "{{ gpu_node_prep_pool.name }}/{{ gpu_node_prep_zone }}"
