---
# Wait until the nodes of one GPU pool (gpu_node_prep_pool) are Running, Ready, expose
# nvidia.com/gpu and carry the GFD label nvidia.com/gpu.memory (only for a pool with a memory
# minimum), then check their GPU memory. Needs the GPU operator (playbooks/10-operators.yml).
# tasks/main.yml waits for the NVIDIA ClusterPolicy after the last pool.

- name: Wait for the GPU machines of the pool
  when: not ansible_check_mode
  vars:
    gpu_node_prep_expected: >-
      {{ [gpu_node_prep_pool_zones[gpu_node_prep_pool.name] | length, gpu_node_prep_pool.active_zone_count | int] | min
         * (gpu_node_prep_pool.replicas | int) }}
  block:
    # Done when the expected number of machines is Running (0 after a scale-down),
    # or as soon as one machine is Failed (e.g. AWS quota or capacity errors).
    - name: Wait until the GPU machines are Running or one fails
      kubernetes.core.k8s_info:
        api_version: machine.openshift.io/v1beta1
        kind: Machine
        namespace: "{{ gpu_node_prep_machine_api_namespace }}"
        label_selectors:
          - "machine.openshift.io/cluster-api-cluster={{ gpu_node_prep_infra_id }}"
          - "machine.openshift.io/cluster-api-machine-type={{ gpu_node_prep_pool.name }}"
      register: gpu_node_prep_machines
      until: >-
        (gpu_node_prep_machines.resources | default([]) | selectattr('status.phase', 'defined')
         | selectattr('status.phase', 'equalto', 'Failed') | list | length > 0)
        or (gpu_node_prep_machines.resources | default([]) | length == gpu_node_prep_expected | int
            and gpu_node_prep_machines.resources | default([]) | selectattr('status.phase', 'defined')
                | selectattr('status.phase', 'equalto', 'Running') | list | length == gpu_node_prep_expected | int)
      retries: "{{ ((gpu_node_prep_timeout | int) / (gpu_node_prep_poll_delay | int)) | round(0, 'ceil') | int }}"
      delay: "{{ gpu_node_prep_poll_delay }}"
      failed_when: false

    - name: Assert no GPU machine failed
      vars:
        gpu_node_prep_failed: >-
          {{ gpu_node_prep_machines.resources | default([]) | selectattr('status.phase', 'defined')
             | selectattr('status.phase', 'equalto', 'Failed') | list }}
      ansible.builtin.assert:
        that:
          - gpu_node_prep_failed | length == 0
        fail_msg: >-
          Pool {{ gpu_node_prep_pool.name }}: GPU machine(s) failed:
          {% for m in gpu_node_prep_failed %}{{ m.metadata.name }}: {{ m.status.errorMessage | default('no message') }}; {% endfor %}
          Check the AWS quota for G instances and the {{ gpu_node_prep_pool.instance_type }} capacity in the zone.
        quiet: true

    - name: Assert the GPU machines are Running
      ansible.builtin.assert:
        that:
          - gpu_node_prep_machines.resources | default([]) | length == gpu_node_prep_expected | int
          - >-
            gpu_node_prep_machines.resources | default([]) | selectattr('status.phase', 'defined')
            | selectattr('status.phase', 'equalto', 'Running') | list | length == gpu_node_prep_expected | int
        fail_msg: >-
          Pool {{ gpu_node_prep_pool.name }}: expected {{ gpu_node_prep_expected }} Running GPU machine(s) after {{ gpu_node_prep_timeout }}s, found:
          {% for m in gpu_node_prep_machines.resources | default([]) %}{{ m.metadata.name }}={{ m.status.phase | default('n/a') }} {% endfor %}
        success_msg: "Pool {{ gpu_node_prep_pool.name }}: {{ gpu_node_prep_expected }} GPU machine(s) Running"

    - name: Wait for the GPU nodes to be Ready
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Node
        label_selectors:
          - "{{ gpu_node_prep_pool.node_labels.keys() | first }}"
        wait: true
        wait_condition: {type: Ready, status: "True"}
        wait_timeout: 600
      when: gpu_node_prep_expected | int > 0

    # The device plugin can make nvidia.com/gpu allocatable before GPU feature discovery (GFD)
    # labels the node: on 2026-10-08 the label nvidia.com/gpu.memory came about one minute later
    # (g7e.2xlarge). A pool with a memory minimum waits for the label too, so that the memory
    # check reads a real value. failed_when false: the assert below names the nodes.
    - name: Wait until every GPU node exposes nvidia.com/gpu and its GPU memory label
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Node
        label_selectors:
          - "{{ gpu_node_prep_pool.node_labels.keys() | first }}"
      register: gpu_node_prep_gpu_nodes
      vars:
        gpu_node_prep_need_label: "{{ gpu_node_prep_pool.min_gpu_memory_mib | default(0) | int > 0 }}"
        gpu_node_prep_with_gpu: >-
          {%- set acc = namespace(n=0) -%}
          {%- for node in gpu_node_prep_gpu_nodes.resources | default([]) -%}
          {%- if (node.status.allocatable | default({}))['nvidia.com/gpu'] | default('0') | int >= 1
                and (not gpu_node_prep_need_label | bool
                     or (node.metadata.labels | default({}))['nvidia.com/gpu.memory'] | default('') | length > 0) -%}
          {%- set acc.n = acc.n + 1 -%}
          {%- endif -%}
          {%- endfor -%}
          {{ acc.n }}
      until:
        - gpu_node_prep_gpu_nodes.resources | default([]) | length == gpu_node_prep_expected | int
        - gpu_node_prep_with_gpu | int == gpu_node_prep_expected | int
      retries: "{{ ((gpu_node_prep_gpu_timeout | int) / (gpu_node_prep_poll_delay | int)) | round(0, 'ceil') | int }}"
      delay: "{{ gpu_node_prep_poll_delay }}"
      failed_when: false
      when:
        - gpu_node_prep_expected | int > 0
        - gpu_node_prep_wait_gpu_allocatable | bool

    # One list per cause, with the node names: no nvidia.com/gpu (NVIDIA driver or device plugin),
    # no GFD memory label (gpu-feature-discovery or NFD), less GPU memory than the minimum. A
    # smaller GPU never gets the model of the pool Ready (for example Qwen3.8 NVFP4 on an L40S).
    - name: Assert the GPU nodes of the pool and their GPU memory
      vars:
        gpu_node_prep_nodes: "{{ gpu_node_prep_gpu_nodes.resources | default([]) }}"
        gpu_node_prep_min_memory: "{{ gpu_node_prep_pool.min_gpu_memory_mib | default(0) | int }}"
        gpu_node_prep_check: >-
          {%- set acc = namespace(no_gpu=[], no_label=[], small=[]) -%}
          {%- for node in gpu_node_prep_nodes -%}
          {%- set memory = (node.metadata.labels | default({}))['nvidia.com/gpu.memory'] | default('') -%}
          {%- if (node.status.allocatable | default({}))['nvidia.com/gpu'] | default('0') | int < 1 -%}
          {%- set acc.no_gpu = acc.no_gpu + [node.metadata.name] -%}
          {%- elif gpu_node_prep_min_memory | int > 0 and memory | length == 0 -%}
          {%- set acc.no_label = acc.no_label + [node.metadata.name] -%}
          {%- elif memory | length > 0 and memory | int < gpu_node_prep_min_memory | int -%}
          {%- set acc.small = acc.small + [node.metadata.name ~ ' (' ~ memory ~ ' MiB)'] -%}
          {%- endif -%}
          {%- endfor -%}
          {{ {'no_gpu': acc.no_gpu, 'no_label': acc.no_label, 'small': acc.small} }}
      ansible.builtin.assert:
        that:
          - gpu_node_prep_nodes | length == gpu_node_prep_expected | int
          - gpu_node_prep_check.no_gpu | length == 0
          - gpu_node_prep_check.no_label | length == 0
          - gpu_node_prep_check.small | length == 0
        fail_msg: >-
          Pool {{ gpu_node_prep_pool.name }}:
          {% if gpu_node_prep_nodes | length != gpu_node_prep_expected | int %}expected {{ gpu_node_prep_expected }}
          GPU node(s), found {{ gpu_node_prep_nodes | length }}.{% endif %}
          {% if gpu_node_prep_check.no_gpu %}No nvidia.com/gpu after {{ gpu_node_prep_gpu_timeout }}s
          (NVIDIA driver or device plugin): {{ gpu_node_prep_check.no_gpu | join(', ') }}.{% endif %}
          {% if gpu_node_prep_check.no_label %}No GFD label nvidia.com/gpu.memory after
          {{ gpu_node_prep_gpu_timeout }}s (gpu-feature-discovery or NFD): {{ gpu_node_prep_check.no_label | join(', ') }}.{% endif %}
          {% if gpu_node_prep_check.small %}Less than {{ gpu_node_prep_min_memory }} MiB of GPU memory:
          {{ gpu_node_prep_check.small | join(', ') }}. Check the instance type of the pool.{% endif %}
        success_msg: >-
          Pool {{ gpu_node_prep_pool.name }}:
          {% for n in gpu_node_prep_nodes %}{{ n.metadata.name }}
          {{ n.metadata.labels['nvidia.com/gpu.product'] | default('n/a') }}
          {{ n.metadata.labels['nvidia.com/gpu.memory'] | default('n/a') }} MiB; {% endfor %}
      when:
        - gpu_node_prep_expected | int > 0
        - gpu_node_prep_wait_gpu_allocatable | bool
