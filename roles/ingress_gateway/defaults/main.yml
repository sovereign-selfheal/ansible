---
# ingress_gateway: the RHOAI inference Gateway and the public passthrough Route in front of it.
# The HTTPRoute, AuthPolicy and TokenRateLimitPolicy that attach to it are in the gitops repo.

ingress_gateway_name: openshift-ai-inference
ingress_gateway_namespace: openshift-ingress
ingress_gateway_class: "{{ gateway_class_name | default('openshift-default') }}"
# Public hostname: <host_prefix>.<apps domain>. Must match the HTTPRoute in the gitops repo.
ingress_gateway_host_prefix: router
ingress_gateway_route_name: maas-router
# Router timeout. LLM answers without streaming can take minutes (a SOTA model with
# reasoning and a large token budget: about 3 minutes).
ingress_gateway_route_timeout: 10m
# Idle timeout of the AWS Classic load balancer of the default IngressController. The AWS
# default is 60s: without streaming no byte flows until the answer is complete, so longer
# answers were cut at 60s. Applied only on AWS with a Classic load balancer; empty = no change.
ingress_gateway_lb_idle_timeout: 10m

# Empty: read from the cluster (ingresses.config/cluster and the default IngressController).
ingress_gateway_apps_domain: ""
ingress_gateway_cert_secret: ""
# Used when the default IngressController has no custom certificate.
ingress_gateway_fallback_cert_secret: router-certs-default

ingress_gateway_timeout: 600
