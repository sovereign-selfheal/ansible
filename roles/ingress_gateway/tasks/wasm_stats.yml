---
# Read wasm.remote_load_fetch_{successes,failures} from the Envoy of every running gateway pod.
# Waits until each pod has tried the download once. Sets:
#   ingress_gateway_wasm_pods        all pods read (names)
#   ingress_gateway_wasm_broken      pods with a failed download (failures > 0)
#   ingress_gateway_wasm_untried     pods with no download attempt after the wait
#   ingress_gateway_wasm_unreadable  pods whose stats could not be read (still running)

- name: Read the gateway pods
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: "{{ ingress_gateway_namespace }}"
    label_selectors:
      - "{{ ingress_gateway_pod_selector }}"
    field_selectors:
      - status.phase=Running
  register: ingress_gateway_pods

# An exec error ends the wait for that pod at once (it is reported below, not retried).
# When the wait runs out, the loop fails: the rescue keeps the results for the report.
- name: Read the wasm download stats
  block:
    - name: Read the wasm download stats of each gateway pod
      kubernetes.core.k8s_exec:
        namespace: "{{ ingress_gateway_namespace }}"
        pod: "{{ ingress_gateway_pod.metadata.name }}"
        container: "{{ ingress_gateway_proxy_container }}"
        command: pilot-agent request GET stats?filter=wasm.remote_load_fetch_
      register: ingress_gateway_wasm_exec
      changed_when: false
      failed_when: false
      until: >-
        (ingress_gateway_wasm_exec.rc | default(1) | int != 0)
        or (ingress_gateway_wasm_exec.stdout | default('')
            | regex_findall('remote_load_fetch_(?:successes|failures): ([0-9]+)') | map('int') | sum) > 0
      retries: "{{ ((ingress_gateway_wasm_wait_timeout | int) / (ingress_gateway_wasm_poll_delay | int)) | round(0, 'ceil') | int }}"
      delay: "{{ ingress_gateway_wasm_poll_delay }}"
      loop: "{{ ingress_gateway_pods.resources | rejectattr('metadata.deletionTimestamp', 'defined') | list }}"
      loop_control:
        loop_var: ingress_gateway_pod
        label: "{{ ingress_gateway_pod.metadata.name }}"
  rescue:
    - name: Note the pods that did not try the download in time
      ansible.builtin.debug:
        msg: "Some gateway pods made no wasm download attempt within {{ ingress_gateway_wasm_wait_timeout }} s (see below)."

- name: Parse the wasm download stats
  ansible.builtin.set_fact:
    ingress_gateway_wasm_state: >-
      {%- set acc = namespace(items=[]) -%}
      {%- for r in ingress_gateway_wasm_exec.results | default([]) -%}
      {%- set out = r.stdout | default('') -%}
      {%- set acc.items = acc.items + [{
            'pod': r.ingress_gateway_pod.metadata.name,
            'read': (r.rc | default(1) | int) == 0,
            'successes': out | regex_findall('remote_load_fetch_successes: ([0-9]+)') | map('int') | sum,
            'failures': out | regex_findall('remote_load_fetch_failures: ([0-9]+)') | map('int') | sum}] -%}
      {%- endfor -%}
      {{ acc.items }}

# A pod that was replaced between the list and the exec is not an error.
- name: Read the gateway pods that still exist
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: "{{ ingress_gateway_namespace }}"
    label_selectors:
      - "{{ ingress_gateway_pod_selector }}"
  register: ingress_gateway_pods_now

- name: Record the state of the gateway pods
  vars:
    ingress_gateway_live: >-
      {{ ingress_gateway_pods_now.resources | rejectattr('metadata.deletionTimestamp', 'defined')
         | map(attribute='metadata.name') | list }}
    ingress_gateway_read: "{{ ingress_gateway_wasm_state | selectattr('read') | list }}"
  ansible.builtin.set_fact:
    ingress_gateway_wasm_pods: "{{ ingress_gateway_wasm_state | map(attribute='pod') | list }}"
    # Healthy: at least one download and no failed one. A failed download (even after a good
    # one, for example a new module version) leaves the filter answering 503.
    ingress_gateway_wasm_broken: "{{ ingress_gateway_read | selectattr('failures', 'gt', 0) | map(attribute='pod') | list }}"
    ingress_gateway_wasm_untried: >-
      {{ ingress_gateway_read | selectattr('failures', 'eq', 0) | selectattr('successes', 'eq', 0)
         | map(attribute='pod') | list }}
    ingress_gateway_wasm_unreadable: >-
      {{ ingress_gateway_wasm_state | rejectattr('read') | map(attribute='pod') | select('in', ingress_gateway_live) | list }}

- name: Show the wasm download stats
  ansible.builtin.debug:
    msg: >-
      {{ ingress_gateway_wasm_item.pod }}:
      {{ ('successes ' ~ ingress_gateway_wasm_item.successes ~ ', failures ' ~ ingress_gateway_wasm_item.failures)
         if ingress_gateway_wasm_item.read else 'stats not readable' }}
  loop: "{{ ingress_gateway_wasm_state }}"
  loop_control:
    loop_var: ingress_gateway_wasm_item
    label: "{{ ingress_gateway_wasm_item.pod }}"
