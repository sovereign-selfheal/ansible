---
# Apply one pre_install/post_install item (olm_operator_post) and wait for its readiness.
# Item fields: template (optional: an item can be a pure wait), vars, state (present|patched),
# wait_exists, wait, enabled. olm_operator_resource_gate is false for post_install items
# while the operator is not installed (check mode only): their CRDs do not exist yet.
# k8s_info with wait returns no object, without failing, when the object never appears. So the
# waits of wait_exists and wait.condition are checked: a missing object fails the item, unless
# wait_exists.optional / wait.optional is true (the object may never appear).

- name: "Skip in check mode when the operator is not installed: {{ olm_operator_post.template | default('wait') }}"
  ansible.builtin.debug:
    msg: "{{ olm_operator_key }}: {{ olm_operator_post.template | default('wait') }} skipped, operator not installed in check mode"
  when: not (olm_operator_resource_gate | bool)

- name: "Apply {{ olm_operator_post.template | default('wait') }}"
  when: olm_operator_resource_gate | bool
  block:
    - name: Wait for the resource to exist
      kubernetes.core.k8s_info:
        api_version: "{{ olm_operator_post.wait_exists.api_version }}"
        kind: "{{ olm_operator_post.wait_exists.kind }}"
        name: "{{ olm_operator_post.wait_exists.name }}"
        namespace: "{{ olm_operator_post.wait_exists.namespace | default(omit) }}"
        wait: true
        wait_timeout: "{{ olm_operator_post.wait_exists.timeout | default(olm_operator_post_install_timeout) }}"
      register: olm_operator_post_exists
      when:
        - olm_operator_post.wait_exists is defined
        - not ansible_check_mode

    - name: Check that the resource exists
      ansible.builtin.assert:
        that: olm_operator_post_exists.resources | length > 0
        fail_msg: >-
          {{ olm_operator_key }}: {{ _w.kind }} {{ _w.name }}{{ ' in ' ~ _w.namespace if _w.namespace is defined else '' }}
          did not appear within {{ _w.timeout | default(olm_operator_post_install_timeout) }} s.
          Set wait_exists.optional to true if it may never appear.
        quiet: true
      vars:
        _w: "{{ olm_operator_post.wait_exists }}"
      when:
        - olm_operator_post.wait_exists is defined
        - not ansible_check_mode
        - not (olm_operator_post.wait_exists.optional | default(false) | bool)

    - name: "Apply {{ olm_operator_post.template | default('') }}"
      when: olm_operator_post.template is defined
      kubernetes.core.k8s:
        state: "{{ olm_operator_post.state | default('present') }}"
        definition: >-
          {{ lookup('ansible.builtin.template', olm_operator_post.template | regex_replace('^templates/', ''),
                    template_vars=olm_operator_post.vars | default({}))
             | ansible.builtin.from_yaml_all | list }}

    - name: Wait for the condition
      kubernetes.core.k8s_info:
        api_version: "{{ olm_operator_post.wait.api_version }}"
        kind: "{{ olm_operator_post.wait.kind }}"
        name: "{{ olm_operator_post.wait.name }}"
        namespace: "{{ olm_operator_post.wait.namespace | default(omit) }}"
        wait: true
        wait_condition: "{{ olm_operator_post.wait.condition }}"
        wait_sleep: "{{ olm_operator_poll_delay }}"
        wait_timeout: "{{ olm_operator_post.wait.timeout | default(olm_operator_post_install_timeout) }}"
      register: olm_operator_post_condition
      when:
        - olm_operator_post.wait.condition is defined
        - not ansible_check_mode

    - name: Check that the resource of the condition exists
      ansible.builtin.assert:
        that: olm_operator_post_condition.resources | length > 0
        fail_msg: >-
          {{ olm_operator_key }}: {{ _w.kind }} {{ _w.name }}{{ ' in ' ~ _w.namespace if _w.namespace is defined else '' }}
          did not appear within {{ _w.timeout | default(olm_operator_post_install_timeout) }} s.
          Set wait.optional to true if it may never appear.
        quiet: true
      vars:
        _w: "{{ olm_operator_post.wait }}"
      when:
        - olm_operator_post.wait.condition is defined
        - not ansible_check_mode
        - not (olm_operator_post.wait.optional | default(false) | bool)

    - name: Wait for the status field
      kubernetes.core.k8s_info:
        api_version: "{{ olm_operator_post.wait.api_version }}"
        kind: "{{ olm_operator_post.wait.kind }}"
        name: "{{ olm_operator_post.wait.name }}"
        namespace: "{{ olm_operator_post.wait.namespace | default(omit) }}"
      register: olm_operator_post_status
      until:
        - olm_operator_post_status.resources | length == 1
        # After a change, the status is valid only once the operator has seen the new
        # generation (when the object reports status.observedGeneration).
        - >-
          ((olm_operator_post_status.resources | first).status | default({})).observedGeneration
          | default((olm_operator_post_status.resources | first).metadata.generation)
          == (olm_operator_post_status.resources | first).metadata.generation
        - >-
          ((olm_operator_post_status.resources | first).status | default({}))[olm_operator_post.wait.status_field]
          | default('') == olm_operator_post.wait.value
      retries: >-
        {{ ((olm_operator_post.wait.timeout | default(olm_operator_post_install_timeout) | int)
            / olm_operator_poll_delay | int) | round(0, 'ceil') | int }}
      delay: "{{ olm_operator_poll_delay }}"
      when:
        - olm_operator_post.wait.status_field is defined
        - not ansible_check_mode
