---
# model_prepull: pull the images of the local model on the nodes that will serve it, as early
# as possible and in parallel (one DaemonSet per image). The InferenceService of the gitops
# repo then finds them in the node cache. The DaemonSets stay: their pods keep the images in use,
# so the kubelet does not delete them.

model_prepull_namespace: sovereign-selfheal-prepull

# `gpu` (Qwen3.8 27B on the GPU nodes) or `cpu` (small Qwen on the workers). Same rule as
# argocd_seed_model_profile.
model_prepull_profile: "{{ 'gpu' if (gpu_enabled | default(true) | bool) else 'cpu' }}"

# Images per profile, by digest, without the oci:// prefix of storageUri.
# They must match localModel.profiles.<profile>.storageUri and .runtimeImage in
# gitops/bootstrap/values.yaml; after the seed, tasks/verify.yml warns when they differ.
model_prepull_images:
  gpu:
    # qwen38-27b-nvfp4-d23c6ff (modelcar repo; gitops values.yaml, resolved on 2026-09-28)
    modelcar: quay.io/sovereign-selfheal/modelcar-qwen38-27b-nvfp4@sha256:07490ed7b3ebbd8105de41712a61a3b206c862afdd48a60e7fde0b1f3a249661
    # RHOAI 3.5.1 template vllm-cuda-runtime-template
    runtime: registry.redhat.io/rhaii/vllm-cuda-rhel9@sha256:c056e61672b6aea489ad5dde0bd2f8497230f5333e87f7cf6c494eba3bfdc808
  cpu:
    # qwen2.5-0.5b-instruct-20260810t1646z (gitops values.yaml, resolved on 2026-09-24)
    modelcar: quay.io/redhat-ai-services/modelcar-catalog@sha256:e20441c23be795838409137576b9016e6bc941eec79e5765cf9de6319c0ec769
    # RHOAI 3.5.1 template vllm-cpu-x86-runtime-template
    runtime: registry.redhat.io/rhaii/vllm-cpu-rhel9@sha256:7a28b867955055a8836ea2a78e70b8bad63c1ee50e8a5f8dd95d1194f20ec489

# Command of each pre-pull container: it only has to stay up. The modelcar image has sh and
# sleep (KServe runs `sleep infinity` in it too).
model_prepull_commands:
  modelcar: [sh, -c, sleep infinity]
  runtime: [sleep, infinity]

# Nodes. gpu: the label that roles/gpu_node_prep puts on the node when it is created, so the
# pull starts as soon as the node joins (nvidia.com/gpu.present appears only after NFD and the
# GPU operator). GPU nodes from outside (gpu_nodes_managed false): the preflight label.
model_prepull_node_selectors:
  gpu: >-
    {{ {'node-role.kubernetes.io/gpu': ''} if (gpu_nodes_managed | default(true) | bool)
       else {'nvidia.com/gpu.present': 'true'} }}
  cpu:
    node-role.kubernetes.io/worker: ""
# The same toleration as the InferenceService of the gitops repo.
model_prepull_tolerations:
  gpu:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  cpu: []

# Decision model (decision_model_enabled): its images on the nodes of the gpu-decision pool of
# roles/gpu_node_prep, in DaemonSets prepull-decision-<key>. They must match decisionModel in
# gitops/bootstrap/values.yaml. The Qwen images are not pulled there, and these not on Qwen's node.
model_prepull_decision_enabled: "{{ (decision_model_enabled | default(false) | bool) and model_prepull_profile == 'gpu' }}"
model_prepull_decision_images:
  # diffusiongemma-26b-a4b-fp8-3b3dae4 (modelcar repo), resolved on quay.io on 2026-09-30
  modelcar: quay.io/sovereign-selfheal/modelcar-diffusiongemma-26b-a4b-fp8@sha256:b10821319f60a03ec78e6aacf57bedca83e540fd8b0cbcbf3ffc644215e81fc6
  # rhaii-preview/vllm-cuda-rhel9:diffusiongemma-jev (linux/amd64), resolved on registry.redhat.io
  # on 2026-09-30. Unsupported preview image (vLLM 0.29.1.dev1248).
  runtime: registry.redhat.io/rhaii-preview/vllm-cuda-rhel9@sha256:24fccf947aa33857611efed0d57aead4efc525c78a882760db5229b702713a1a
model_prepull_decision_node_selector:
  node-role.kubernetes.io/gpu-decision: ""

# Every pre-pull DaemonSet: prepull-<component>. The components of the selected profile keep
# their names (modelcar, runtime); the decision model adds decision-modelcar and decision-runtime.
model_prepull_entries: >-
  {%- set acc = namespace(list=[]) -%}
  {%- for key, image in model_prepull_images[model_prepull_profile] | dictsort -%}
  {%- set acc.list = acc.list + [{'component': key, 'kind': key, 'image': image,
                                  'node_selector': model_prepull_node_selectors[model_prepull_profile],
                                  'tolerations': model_prepull_tolerations[model_prepull_profile]}] -%}
  {%- endfor -%}
  {%- if model_prepull_decision_enabled | bool -%}
  {%- for key, image in model_prepull_decision_images | dictsort -%}
  {%- set acc.list = acc.list + [{'component': 'decision-' ~ key, 'kind': key, 'image': image,
                                  'node_selector': model_prepull_decision_node_selector,
                                  'tolerations': model_prepull_tolerations['gpu']}] -%}
  {%- endfor -%}
  {%- endif -%}
  {{ acc.list }}

model_prepull_resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 64Mi

# Pod of the model server, for the check after the seed (tasks/verify.yml).
model_prepull_predictor_namespace: local-models
model_prepull_predictor_selector: component=predictor
