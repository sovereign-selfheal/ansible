---
- name: Seed the gitops repo
  ansible.builtin.debug:
    msg: >-
      Root Application {{ argocd_seed_namespace }}/{{ argocd_seed_app_name }} ->
      {{ argocd_seed_repo_url }}@{{ argocd_seed_revision }}:{{ argocd_seed_path }},
      model profile {{ argocd_seed_model_profile }}, secret store enabled {{ argocd_seed_secret_store_enabled }},
      observability enabled {{ argocd_seed_observability_enabled }},
      decision model enabled {{ argocd_seed_decision_model_enabled }},
      triage-agent-operator enabled {{ argocd_seed_triage_agent_operator_enabled }}

- name: Decide the routing mode
  vars:
    argocd_seed_sota_set: >-
      {{ [argocd_seed_sota_api_base | length > 0, argocd_seed_sota_model | length > 0,
          argocd_seed_sota_api_key_set | bool] }}
  ansible.builtin.set_fact:
    argocd_seed_sota_enabled: "{{ argocd_seed_sota_set is all }}"
    argocd_seed_sota_partial: "{{ (argocd_seed_sota_set is any) and not (argocd_seed_sota_set is all) }}"

- name: Fail on a partial SOTA configuration
  ansible.builtin.fail:
    msg: >-
      Only some SOTA values are set. Hybrid routing needs sota_api_base, sota_model and sota_api_key
      (group_vars/all/vault.yml or AgnosticV); local-only mode needs none of them.
      Set: api_base={{ argocd_seed_sota_api_base | length > 0 }}, model={{ argocd_seed_sota_model | length > 0 }},
      api_key={{ argocd_seed_sota_api_key_set | bool }}.
  when: argocd_seed_sota_partial | bool

- name: Check the classifier mode
  ansible.builtin.assert:
    that:
      - argocd_seed_classifier_mode in ['local', 'external', 'off']
      - >-
        argocd_seed_classifier_mode != 'external'
        or ((argocd_seed_secret_store_enabled | bool)
            and (classifier_base_url | default('') | length > 0)
            and (classifier_model | default('') | length > 0))
    fail_msg: >-
      classifier_mode must be local, external or off (got {{ argocd_seed_classifier_mode }}).
      external needs the secret store and classifier_base_url, classifier_model (and usually
      classifier_api_key) in group_vars/all/vault.yml.
    quiet: true

- name: Report the routing mode
  vars:
    argocd_seed_mode_msg: >-
      {{ ('Hybrid routing: local model + SOTA ' ~ argocd_seed_sota_model
          ~ ' (reasoning ' ~ ('on' if argocd_seed_sota_reasoning | bool else 'off') ~ ')')
         if argocd_seed_sota_enabled | bool
         else 'Local-only mode: no SOTA configured (group_vars/all/vault.yml), every request goes to the local model' }}
  ansible.builtin.debug:
    msg: "{{ argocd_seed_mode_msg }} | classifier mode {{ argocd_seed_classifier_mode }}"

- name: Read the cluster ingress configuration
  kubernetes.core.k8s_info:
    api_version: config.openshift.io/v1
    kind: Ingress
    name: cluster
  register: argocd_seed_ingress_config

- name: Build the values of the root Application
  ansible.builtin.set_fact:
    argocd_seed_values: >-
      {{ {'appsDomain': (argocd_seed_ingress_config.resources | first).spec.domain,
          'modelProfile': argocd_seed_model_profile,
          'sota': {'enabled': argocd_seed_sota_enabled | bool,
                   'apiBase': argocd_seed_sota_api_base,
                   'model': argocd_seed_sota_model,
                   'servedMatch': argocd_seed_sota_served_match,
                   'reasoning': argocd_seed_sota_reasoning | bool},
          'secretStore': {'enabled': argocd_seed_secret_store_enabled | bool},
          'classifier': {'mode': argocd_seed_classifier_mode},
          'observability': {'enabled': argocd_seed_observability_enabled | bool},
          'decisionModel': {'enabled': argocd_seed_decision_model_enabled | bool},
          'namespacePolicy': {'scan': argocd_seed_namespace_policy_scan | bool,
                              'hint': argocd_seed_namespace_policy_hint | bool},
          'sotaBudget': {'enabled': argocd_seed_sota_budget_enabled | bool},
          'triageAgentOperator': {'enabled': argocd_seed_triage_agent_operator_enabled | bool},
          'namespaces': ({'observability': argocd_seed_observability_namespace}
                         | combine(argocd_seed_app_namespace_values)),
          'repo': {'url': argocd_seed_repo_url, 'targetRevision': argocd_seed_revision}}
         | combine({'localModel': {'profiles': {argocd_seed_model_profile: {'nodeSelector': argocd_seed_local_model_node_selector}}}}
                   if argocd_seed_local_model_node_selector | length > 0 else {}, recursive=true)
         | combine(argocd_seed_extra_values, recursive=true) }}

- name: Ensure the workload namespaces
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ argocd_seed_ns.name }}"
        labels: "{{ argocd_seed_ns.labels }}"
  loop: "{{ argocd_seed_namespaces }}"
  loop_control:
    loop_var: argocd_seed_ns
    label: "{{ argocd_seed_ns.name }}"

- name: Ensure the cluster roles for gitops components
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: "{{ argocd_seed_cr.name }}"
      rules: "{{ argocd_seed_cr.rules }}"
  loop: "{{ argocd_seed_cluster_roles }}"
  loop_control:
    loop_var: argocd_seed_cr
    label: "{{ argocd_seed_cr.name }}"

- name: Ensure the cluster role bindings for gitops components
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: "{{ argocd_seed_crb.name }}"
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: "{{ argocd_seed_crb.cluster_role }}"
      subjects:
        - kind: ServiceAccount
          name: "{{ argocd_seed_crb.service_account }}"
          namespace: "{{ argocd_seed_crb.namespace }}"
  loop: "{{ argocd_seed_cluster_role_bindings }}"
  loop_control:
    loop_var: argocd_seed_crb
    label: "{{ argocd_seed_crb.name }}"

- name: Ensure the custom health checks of Argo CD
  kubernetes.core.k8s:
    state: patched
    api_version: argoproj.io/v1beta1
    kind: ArgoCD
    name: "{{ argocd_seed_argocd_name }}"
    namespace: "{{ argocd_seed_namespace }}"
    merge_type: merge
    definition:
      spec:
        resourceHealthChecks: >-
          {%- set acc = namespace(list=[]) -%}
          {%- for hc in argocd_seed_health_checks -%}
          {%- set acc.list = acc.list + [{'group': hc.group, 'kind': hc.kind,
                                          'check': lookup('ansible.builtin.file', hc.file)}] -%}
          {%- endfor -%}
          {{ acc.list }}

# Before the root Application: the controller restarts with the new resources before the syncs.
- name: Ensure the resources of the Argo CD application controller
  kubernetes.core.k8s:
    state: patched
    api_version: argoproj.io/v1beta1
    kind: ArgoCD
    name: "{{ argocd_seed_argocd_name }}"
    namespace: "{{ argocd_seed_namespace }}"
    merge_type: merge
    definition:
      spec:
        controller:
          resources: "{{ argocd_seed_controller_resources }}"
  when: argocd_seed_controller_resources | length > 0

- name: Roll out the application controller with these resources
  when:
    - argocd_seed_controller_resources | length > 0
    - not ansible_check_mode
  vars:
    argocd_seed_controller_pod_name: "{{ argocd_seed_argocd_name }}-application-controller-0"
    argocd_seed_controller_limit: "{{ (argocd_seed_controller_resources.limits | default({})).memory | default('') }}"
  block:
    - name: Read the application controller pod
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        name: "{{ argocd_seed_controller_pod_name }}"
        namespace: "{{ argocd_seed_namespace }}"
      register: argocd_seed_controller_pod

    # A StatefulSet does not replace a pod that is not Ready: a controller that is OOMKilled in a
    # loop keeps the old limit forever (seen on 2026-10-15). Such a pod (old limit, restarted, not
    # Ready, not already terminating) is deleted, so that the StatefulSet creates it again from the
    # new template. A healthy pod is left to the rolling update of the StatefulSet.
    - name: Replace a controller pod that crashes with the old memory limit
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: Pod
        name: "{{ argocd_seed_controller_pod_name }}"
        namespace: "{{ argocd_seed_namespace }}"
      vars:
        argocd_seed_pod: "{{ argocd_seed_controller_pod.resources | first }}"
      when:
        - argocd_seed_controller_pod.resources | length > 0
        - argocd_seed_pod.metadata.deletionTimestamp is not defined
        - ((argocd_seed_pod.spec.containers | first).resources.limits | default({})).memory | default('')
          != argocd_seed_controller_limit
        - not (argocd_seed_pod.status.containerStatuses | default([{}]) | first).ready | default(false)
        - (argocd_seed_pod.status.containerStatuses | default([{}]) | first).restartCount | default(0) | int > 0

    - name: Wait until the application controller runs with the new memory limit
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        name: "{{ argocd_seed_controller_pod_name }}"
        namespace: "{{ argocd_seed_namespace }}"
      register: argocd_seed_controller_pod_new
      until:
        - argocd_seed_controller_pod_new.resources | default([]) | length > 0
        - (((argocd_seed_controller_pod_new.resources | first).spec.containers | first).resources.limits | default({})).memory
          | default('') == argocd_seed_controller_limit
        - ((argocd_seed_controller_pod_new.resources | first).status.containerStatuses | default([{}]) | first).ready | default(false)
      retries: 30
      delay: 10
      when: argocd_seed_controller_limit | length > 0

- name: Read the Argo CD instance
  kubernetes.core.k8s_info:
    api_version: argoproj.io/v1beta1
    kind: ArgoCD
    name: "{{ argocd_seed_argocd_name }}"
    namespace: "{{ argocd_seed_namespace }}"
  register: argocd_seed_argocd
  when: argocd_seed_admin_groups | length > 0

# Line by line: only the missing lines are appended, so a rerun gives changed=0.
- name: Add the admin groups to the Argo CD RBAC policy
  vars:
    argocd_seed_policy_lines: >-
      {{ ((argocd_seed_argocd.resources | first).spec.rbac.policy | default('', true)).splitlines()
         if argocd_seed_argocd.resources | length > 0 else [] }}
    argocd_seed_wanted_lines: >-
      {{ argocd_seed_admin_groups | map('regex_replace', '^', 'g, ') | map('regex_replace', '$', ', role:admin') | list }}
    argocd_seed_missing_lines: >-
      {{ argocd_seed_wanted_lines | reject('in', argocd_seed_policy_lines | map('trim') | list) | list }}
  kubernetes.core.k8s:
    state: patched
    api_version: argoproj.io/v1beta1
    kind: ArgoCD
    name: "{{ argocd_seed_argocd_name }}"
    namespace: "{{ argocd_seed_namespace }}"
    merge_type: merge
    definition:
      spec:
        rbac:
          policy: "{{ (argocd_seed_policy_lines + argocd_seed_missing_lines) | join('\n') }}"
  when:
    - argocd_seed_admin_groups | length > 0
    - argocd_seed_missing_lines | length > 0

- name: Ensure the root Application
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('ansible.builtin.template', 'root-application.yaml.j2') | ansible.builtin.from_yaml }}"
  register: argocd_seed_root_applied

# Synced/Healthy on the root Application alone is not enough: right after a new seed it still
# shows the result of the previous revision (on 2026-10-13 the wait passed in 29 s, and Argo CD
# needed 7 more minutes to sync the new branch). So the wait also checks that Argo CD compared
# the current spec (branch and values) of every Application, and that every component
# Application managed by the root one is at the same commit as the root one.
- name: Wait for the workloads
  when:
    - argocd_seed_wait | bool
    - not ansible_check_mode
  vars:
    # Evaluated again at every retry of the wait (argocd_seed_apps is its result).
    # One "<name>: <reason>" line per Application that is not ready yet.
    argocd_seed_not_ready: >-
      {%- macro why(app, root_revision) -%}
      {%- set st = app.status | default({}) -%}
      {%- set sync = st.sync | default({}) -%}
      {%- set compared = sync.comparedTo | default({}) -%}
      {%- set spec = app.spec | default({}) -%}
      {%- set health = (st.health | default({})).status | default('unknown') -%}
      {%- if not app -%}not created yet
      {%- elif 'argocd.argoproj.io/refresh' in (app.metadata.annotations | default({})) -%}refresh requested
      {%- elif [compared.source | default(none), compared.sources | default(none)]
               != [spec.source | default(none), spec.sources | default(none)] -%}new spec not compared yet
      {%- elif root_revision and sync.revision | default('') != root_revision -%}
      revision {{ (sync.revision | default('none'))[:7] }}, root {{ root_revision[:7] }}
      {%- elif sync.status | default('') != 'Synced' -%}sync {{ sync.status | default('unknown') }}
      {%- elif health != 'Healthy' -%}health {{ health }}
      {%- endif -%}
      {%- endmacro -%}
      {%- set apps = argocd_seed_apps.resources | default([]) -%}
      {%- set root = apps | selectattr('metadata.name', 'eq', argocd_seed_app_name) | first | default({}) -%}
      {%- set root_status = root.status | default({}) -%}
      {%- set root_revision = (root_status.sync | default({})).revision | default('') -%}
      {%- set acc = namespace(list=[]) -%}
      {%- set reason = why(root, '') -%}
      {%- if reason -%}{%- set acc.list = acc.list + [argocd_seed_app_name ~ ': ' ~ reason] -%}{%- endif -%}
      {%- for res in root_status.resources | default([]) if res.kind == 'Application' -%}
      {%- set reason = why(apps | selectattr('metadata.name', 'eq', res.name) | first | default({}), root_revision) -%}
      {%- if reason -%}{%- set acc.list = acc.list + [res.name ~ ': ' ~ reason] -%}{%- endif -%}
      {%- endfor -%}
      {{ acc.list }}
  block:
    # A new commit on the same branch changes no spec, so Argo CD would only see it at its next
    # reconciliation (every 3 minutes). The refresh annotation asks for it now: `normal` resolves
    # the branch again (`hard` would also regenerate the manifests, which is not needed). Argo CD
    # removes the annotation when the refresh is done. It is a request, not a change: changed_when
    # is false. On a new cluster the root Application has no status yet, so only the root is asked.
    - name: Ask Argo CD to refresh the root Application and its component Applications
      kubernetes.core.k8s:
        state: patched
        api_version: argoproj.io/v1alpha1
        kind: Application
        name: "{{ argocd_seed_refresh_app }}"
        namespace: "{{ argocd_seed_namespace }}"
        merge_type: merge
        definition:
          metadata:
            annotations:
              argocd.argoproj.io/refresh: normal
      loop: >-
        {{ [argocd_seed_app_name]
           + ((argocd_seed_root_applied.result | default({})).status | default({})).resources | default([])
             | selectattr('kind', 'eq', 'Application') | map(attribute='name') | list }}
      loop_control:
        loop_var: argocd_seed_refresh_app
      changed_when: false

    - name: Wait until every Application is Synced and Healthy at the new revision
      kubernetes.core.k8s_info:
        api_version: argoproj.io/v1alpha1
        kind: Application
        namespace: "{{ argocd_seed_namespace }}"
      register: argocd_seed_apps
      until: argocd_seed_not_ready | length == 0
      retries: "{{ ((argocd_seed_timeout | int) / (argocd_seed_poll_delay | int)) | round(0, 'ceil') | int }}"
      delay: "{{ argocd_seed_poll_delay }}"
      failed_when: false

    - name: Show the state of every Application
      ansible.builtin.debug:
        msg: >-
          {{ argocd_seed_app.metadata.name }}: sync={{ argocd_seed_app.status.sync.status | default('n/a') }}
          health={{ argocd_seed_app.status.health.status | default('n/a') }}
          revision={{ (argocd_seed_app.status.sync.revision | default('n/a'))[:7] }}
          {{ argocd_seed_app.status.conditions | default([]) | map(attribute='message') | join('; ') }}
      loop: "{{ argocd_seed_apps.resources | sort(attribute='metadata.name') }}"
      loop_control:
        loop_var: argocd_seed_app
        label: "{{ argocd_seed_app.metadata.name }}"

    - name: Assert every Application is Synced and Healthy at the new revision
      ansible.builtin.assert:
        that:
          - argocd_seed_not_ready | length == 0
        fail_msg: >-
          Not ready after {{ argocd_seed_timeout }}s: {{ argocd_seed_not_ready | join('; ') }}.
          Check the Applications in the Argo CD console.
        success_msg: "{{ argocd_seed_app_name }} and its component Applications are Synced and Healthy at the new revision"
