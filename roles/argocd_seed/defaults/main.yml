---
# argocd_seed: prepare the default Argo CD instance and create the ROOT Application that
# points to the gitops repo. From then on Argo CD owns every workload (see AGENTS.md §7).

argocd_seed_namespace: openshift-gitops
argocd_seed_argocd_name: openshift-gitops

# Root Application: path `bootstrap` of the gitops repo (a Helm chart).
argocd_seed_app_name: sovereign-selfheal
argocd_seed_repo_url: https://github.com/sovereign-selfheal/gitops.git
argocd_seed_revision: main
argocd_seed_path: bootstrap

# Namespace of the second quarkus-buggy-app (gitops namespaces.triageRestricted).
argocd_seed_restricted_namespace: payments

# Workload namespaces, created here because the default Argo CD instance cannot create
# namespaces. The managed-by label gives that instance admin rights in them.
# sovereign-selfheal.io/data-class is the label of the namespace policy (router v0.11.0): a request
# about a `restricted` namespace stays on the local model; no label or `public` keeps the normal
# routing. A new seed run sets these labels back (a live `oc label` lasts until then).
argocd_seed_namespaces:
  - name: local-models
    labels:
      argocd.argoproj.io/managed-by: "{{ argocd_seed_namespace }}"
      opendatahub.io/dashboard: "true"
      modelmesh-enabled: "false"
  - name: maas-routing
    labels:
      argocd.argoproj.io/managed-by: "{{ argocd_seed_namespace }}"
  - name: agentic-triage
    labels:
      argocd.argoproj.io/managed-by: "{{ argocd_seed_namespace }}"
      sovereign-selfheal.io/data-class: public
  # Second quarkus-buggy-app of the triage demo: the agent investigates it with the local model only.
  - name: "{{ argocd_seed_restricted_namespace }}"
    labels:
      argocd.argoproj.io/managed-by: "{{ argocd_seed_namespace }}"
      sovereign-selfheal.io/data-class: restricted
  # Tempo and the OpenTelemetry collector (gitops component observability). Created also when
  # observability_enabled is false: an empty namespace costs nothing and keeps the contract simple.
  - name: "{{ argocd_seed_observability_namespace }}"
    labels:
      argocd.argoproj.io/managed-by: "{{ argocd_seed_namespace }}"

# Cluster roles for gitops components (the AppProject of the gitops repo allows no
# cluster-scoped objects).
argocd_seed_cluster_roles:
  # Namespace policy of the router (v0.11.0): the hook lists the namespaces with the data-class label.
  - name: sovereign-selfheal-namespace-reader
    rules:
      - apiGroups: [""]
        resources: [namespaces]
        verbs: [get, list, watch]
  # Live page of the routing decisions: its button changes the data-class label of the demo
  # namespaces only, after a SelfSubjectAccessReview with the token of the signed-in user.
  - name: sovereign-selfheal-demo-namespace-labeler
    rules:
      - apiGroups: [""]
        resources: [namespaces]
        resourceNames: [agentic-triage, "{{ argocd_seed_restricted_namespace }}"]
        verbs: [get, patch]

# Cluster-level RBAC prerequisites for gitops components.
argocd_seed_cluster_role_bindings:
  - name: prometheus-mcp-server-sa-cluster-monitoring-view
    namespace: agentic-triage
    service_account: prometheus-mcp-server-sa
    cluster_role: cluster-monitoring-view
  - name: litellm-namespace-reader
    namespace: maas-routing
    service_account: litellm
    cluster_role: sovereign-selfheal-namespace-reader
  # Live page of the routing decisions (gitops component routing-live-view): shows the labels.
  - name: routing-live-view-namespace-reader
    namespace: maas-routing
    service_account: routing-live-view
    cluster_role: sovereign-selfheal-namespace-reader
  - name: routing-live-view-demo-namespace-labeler
    namespace: maas-routing
    service_account: routing-live-view
    cluster_role: sovereign-selfheal-demo-namespace-labeler

# Values of the root Application (bootstrap/values.yaml in the gitops repo).
argocd_seed_model_profile: "{{ 'gpu' if (gpu_enabled | default(true) | bool) else 'cpu' }}"
# Hybrid routing needs all three SOTA values (the key lands through roles/secrets_bootstrap).
# None of them set = local-only mode. Only some of them set = error.
argocd_seed_sota_api_key_set: "{{ (sota_api_key | default('')) | length > 0 }}"
argocd_seed_sota_api_base: "{{ sota_api_base | default('') }}"
argocd_seed_sota_model: "{{ sota_model | default('') }}"
argocd_seed_sota_served_match: "{{ sota_served_match | default('') }}"
argocd_seed_sota_reasoning: "{{ sota_reasoning | default(false) }}"
argocd_seed_secret_store_enabled: "{{ secret_store_enabled | default(false) }}"
argocd_seed_classifier_mode: "{{ classifier_mode | default('local') }}"
# Traces (gitops component observability, value observability.enabled): true only when the
# OpenTelemetry and Tempo operators are installed (observability_enabled).
argocd_seed_observability_enabled: "{{ observability_enabled | default(true) }}"
argocd_seed_observability_namespace: "{{ observability_namespace | default('observability') }}"
# Decision model (gitops component decision-model, value decisionModel.enabled). Always sent,
# so that turning it off also reaches the root Application.
argocd_seed_decision_model_enabled: "{{ decision_model_enabled | default(false) }}"
# With the decision model there are two GPU pools, and nvidia.com/gpu.present (the default
# nodeSelector of the local model) matches both. With nodes from gpu_node_prep the local model
# then selects the node label of its own pool. Sent only with the decision model, so that
# the Qwen pod of an existing cluster is not recreated by a new seed.
argocd_seed_local_model_node_selector: >-
  {{ {'node-role.kubernetes.io/gpu': ''}
     if (argocd_seed_decision_model_enabled | bool and (gpu_nodes_managed | default(true) | bool)
         and argocd_seed_model_profile == 'gpu')
     else {} }}
# Namespace policy of the router (gitops namespacePolicy.scan/hint). Always sent, so that turning
# it off also reaches the root Application.
argocd_seed_namespace_policy_scan: "{{ namespace_policy_scan | default(true) }}"
argocd_seed_namespace_policy_hint: "{{ namespace_policy_hint | default(false) }}"
# SOTA budget per tier of the router (gitops sotaBudget.enabled). Always sent, like the switches above.
argocd_seed_sota_budget_enabled: "{{ sota_budget_enabled | default(false) }}"
# Any other value of bootstrap/values.yaml, merged last (for example {tiers: [...]}).
argocd_seed_extra_values: {}

# Custom health checks on the ArgoCD CR (Argo CD already knows InferenceService,
# ExternalSecret and OpenTelemetryCollector). They replace spec.resourceHealthChecks of the instance.
# Must match gitops MCPServer CRs (mcp.x-k8s.io/v1alpha1); see gitops/components/*/templates/mcpserver.yaml
argocd_seed_mcpserver_api_group: mcp.x-k8s.io
argocd_seed_health_checks:
  - group: argoproj.io
    kind: Application
    file: health-application.lua
  - group: kuadrant.io
    kind: AuthPolicy
    file: health-kuadrant-policy.lua
  - group: kuadrant.io
    kind: TokenRateLimitPolicy
    file: health-kuadrant-policy.lua
  # Argo CD 3.4 (GitOps 1.21) has a built-in check for OpenTelemetryCollector, none for Tempo.
  - group: tempo.grafana.com
    kind: TempoMonolithic
    file: health-tempo.lua
  # RHOAI MCP Lifecycle: Healthy when the MCPServer reports Ready.
  - group: "{{ argocd_seed_mcpserver_api_group }}"
    kind: MCPServer
    file: health-mcpserver.lua

# OpenShift Groups that are admin in the Argo CD UI (Dex passes the OpenShift groups to Argo CD).
# One line `g, <group>, role:admin` per group is added to spec.rbac.policy; the lines already
# there (e.g. the RHDP `g, admin, role:admin`) are kept. Default: the team Group of
# roles/team_access, when team_users is set.
argocd_seed_admin_groups: >-
  {{ [team_group | default('selfheal-team')] if (team_access_enabled | default(false) | bool) else [] }}

# Wait until the root Application (and so every component) is Synced and Healthy.
# With the gpu profile the first start of the local model takes about 27 minutes on a new GPU
# node (Qwen3.8 on 2026-09-29: image pulls with one CRI-O restart, then about 4 minutes of model
# load), so the wait is longer there.
argocd_seed_wait: true
argocd_seed_timeout: "{{ 3600 if argocd_seed_model_profile == 'gpu' else 1800 }}"
argocd_seed_poll_delay: 20
