[project]
name = "sovereign-selfheal-ansible"
version = "0.1.0"
description = "Day 0/1 bootstrap of the Sovereign Self-Healing Platform demo"
requires-python = ">=3.12"
dependencies = [
    # Tested with ansible-core 2.20; 2.21 is not validated yet.
    "ansible-core>=2.20,<2.21",
    # Python client used by the kubernetes.core modules.
    "kubernetes>=31.0.0",
]

[dependency-groups]
# Installed by default with `uv sync`; skip them with `uv sync --no-dev`.
dev = [
    "ansible-lint>=25.0.0",
    "yamllint>=1.35.0",
]

[tool.uv]
# This repo is not a Python package: uv manages only the virtual environment.
package = false
